# Trusted Bash configuration, sourced by bin/unquarantine.
# Environment variables override these settings, even when explicitly empty.

# Extensions to clean, space-separated, no leading dot (case-insensitive).
EXTENSIONS="conf cfg"

# Space-separated absolute directories. Literal ~/ is expanded; relative paths
# and ~otheruser are rejected (launchd does not share your shell's cwd).
# For whitespace in directory names, use a Bash array instead:
# WATCH_DIRS=("$HOME/Downloads" "$HOME/Downloads/Other files")
WATCH_DIRS="$HOME/Downloads"

# Descend up to MAX_DEPTH levels; top-level files are depth 1.
RECURSIVE=false
MAX_DEPTH=3

# Empty disables logging. Dry runs never write logs or read-health state.
LOG_FILE="$HOME/.local/state/unquarantine.log"
DRY_RUN=false
