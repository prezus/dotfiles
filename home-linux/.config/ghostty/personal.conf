# Our ghostty settings, included from ~/.config/ghostty/config by
# `dotfiles omarchy-includes`. Kept OUT of that file because `omarchy refresh
# config ghostty/config` rewrites it from the package default and would take our
# settings with it — and because its theme include must survive untouched.
# NOTE: no `theme =` here. This file is included AFTER omarchy's own
# `config-file = ?.../current/theme/ghostty.conf`, so setting a theme would
# override it and `omarchy theme set` would appear to do nothing. On Linux,
# theming is Omarchy's.

font-size = 14
# Static Monaspace, not the "… Var" build: every named instance in the variable
# fonts is prefixed "ExtraLight" ("ExtraLight Regular", "ExtraLight Bold"), so
# the font-style lines below resolve against the statics and nothing else.
# Verified with `ghostty +list-fonts`. Mirrors zed/settings.json — Xenon for UI,
# Neon for the buffer.
font-family = "Monaspace Neon"
font-family-bold = "Monaspace Xenon"
font-family-italic = "Monaspace Radon"
#font-family-bold-italic = "Operator Mono SSm Lig"

font-style = Regular
font-style-italic = Italic
font-style-bold = Bold
font-style-bold-italic = Bold Italic



background-blur-radius = 20
mouse-hide-while-typing = true
window-decoration = true
cursor-style-blink = true



#background-opacity = 0.8
# background-blur-radius = 20

clipboard-read = allow
clipboard-paste-protection = false
clipboard-write = allow

keybind = shift+enter=text:\n

# Must match the login shell `dotfiles fish` sets, or Ghostty injects the wrong
# integration. `detect` would also work; pinned because fish is not a guess here.
shell-integration = fish
quit-after-last-window-closed = true
