# Send all audio to megatron (main Windows PC, 192.168.10.18) over VBAN; Voicemeeter Banana there mixes it into the headphones.
# Receiver setup: decepticon.io infra/scourge/windows/vban-receiver.ps1. Name, port and rate must match it.
# Make it the default output once: pactl set-default-sink vban-sender (WirePlumber remembers the choice).
context.modules = [
  { name = libpipewire-module-vban-send
    # nofail: a bad address must not stop PipeWire (and all local audio) from starting
    flags = [ nofail ]
    args = {
      destination.ip   = "192.168.10.18"   # megatron
      destination.port = 6980
      sess.name        = "PC2"
      audio.format     = "S16LE"
      audio.rate       = 48000
      audio.channels   = 2
      audio.position   = [ FL FR ]
      stream.props = {
        media.class      = "Audio/Sink"
        node.name        = "vban-sender"
        node.description = "VBAN to Main PC"
      }
    }
  }
]
